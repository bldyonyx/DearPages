<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dear Pages — aperçu des notes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import BookNotesPreview from '/src/preview/BookNotesPreview.jsx'
      if (!import.meta.env.DEV || !['127.0.0.1', 'localhost'].includes(location.hostname)) {
        throw new Error('This preview is local development only')
      }
      createRoot(document.getElementById('root')).render(React.createElement(BookNotesPreview))
    </script>
  </body>
</html>
